<style>
.field-home { color: #2f3d32; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
.field-home img { max-width: 100%; height: auto; display: block; }
.field-home a { text-decoration: none; }
.field-mosaic {
  display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 220px;
  max-width: 1280px; margin: 0 auto; gap: 8px; padding: 8px;
}
.field-tile { position: relative; display: block; overflow: hidden; border-radius: 8px; color: #fffdf8 !important; }
.field-home .field-tile img {
  position: absolute; inset: 0; width: 100%; height: 100%; max-width: none;
  object-fit: cover; object-position: center;
  transition: transform 0.7s ease;
}
.field-home .field-tile:hover img { transform: scale(1.08); }
.field-tile span {
  position: absolute; left: 16px; bottom: 14px; text-shadow: 0 1px 8px rgba(47, 61, 50, 0.45);
}
.field-tile small { display: block; font-size: 13px; letter-spacing: 0.08em; }
.field-tile b { display: block; font-size: 22px; font-weight: 700; }
.field-tile.tall { grid-column: 5; grid-row: 1 / span 2; }
@media (max-width: 900px) {
  .field-mosaic { grid-template-columns: 1fr 1fr; grid-auto-rows: 180px; }
  .field-tile.tall { grid-column: auto; grid-row: auto; }
}
